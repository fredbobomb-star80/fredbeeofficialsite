<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Federico (FredBee) Della Corte — musica, scrittura, idee, video, poker e progetti.">
  <title>Federico (FredBee) Della Corte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site" aria-label="Sito personale di Federico Della Corte">
    <div class="poster" aria-label="Bazar Immaginario">
      <div class="grid" aria-label="Contenuti">
        <section class="slot music" aria-labelledby="music-title">
          <h2 id="music-title" class="sr-only">Musica</h2>
          <img src="assets/musica.png" alt="Musica — singoli, album, musiche e canzoni originali">
          <a class="full-link" href="https://open.spotify.com/artist/2cmrlFHGVlxnBY5yJMULeA" target="_blank" rel="noopener" aria-label="Ascolta FredBee su Spotify"></a>
        </section>

        <section class="slot about" aria-labelledby="about-title">
          <h2 id="about-title" class="sr-only">Chi sono</h2>
          <img src="assets/chi-sono.png" alt="Chi sono — Federico Della Corte">
        </section>

        <section class="slot oracle" aria-labelledby="oracle-title">
          <h2 id="oracle-title" class="sr-only">Chiedilo all'Oracolo del Rock</h2>
          <img src="assets/oracolo.png" alt="Chiedilo all'Oracolo del Rock — 666 risposte non adatte ai deboli di cuore">
        </section>

        <section class="slot video" aria-labelledby="video-title">
          <h2 id="video-title" class="sr-only">Video</h2>
          <img src="assets/video.png" alt="Video clip e varietà">
        </section>

        <section class="slot poker placeholder" aria-labelledby="poker-title">
          <h2 id="poker-title" class="sr-only">Poker Pro Player</h2>
          <img src="assets/musica.png" alt="Placeholder temporaneo per Poker Pro Player">
        </section>

        <section class="slot patent placeholder" aria-labelledby="patent-title">
          <h2 id="patent-title" class="sr-only">Il mio brevetto</h2>
          <img src="assets/oracolo.png" alt="Placeholder temporaneo per Il mio brevetto">
        </section>

        <section class="slot writing placeholder" aria-labelledby="writing-title">
          <h2 id="writing-title" class="sr-only">Scrittura</h2>
          <img src="assets/oracolo.png" alt="Placeholder temporaneo per Scrittura">
        </section>

        <section class="slot ideas placeholder" aria-labelledby="ideas-title">
          <h2 id="ideas-title" class="sr-only">Idee</h2>
          <img src="assets/video.png" alt="Placeholder temporaneo per Idee">
        </section>
      </div>
    </div>
  </main>
</body>
</html>
